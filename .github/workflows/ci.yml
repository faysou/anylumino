name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend bundles
        run: npm run build

      - name: Verify committed bundles are current
        run: git diff --exit-code -- src/anylumino/static

      - name: Regenerate bundled dependency licenses
        run: npm run licenses

      - name: Verify the license inventory is current
        run: git diff --exit-code -- THIRD_PARTY_LICENSES.md

      - name: Run frontend tests
        run: npm test

      - name: Install Python dependencies
        run: uv sync --dev

      - name: Check documentation
        run: make docs-check

      - name: Run tests
        run: uv run --no-sync pytest

      - name: Build distributions
        run: uv build

      - name: Validate distributions for publication
        run: uv publish --dry-run --trusted-publishing never dist/*

      - name: Test installed wheel
        run: |
          uv venv /tmp/anylumino-wheel
          uv pip install --python /tmp/anylumino-wheel/bin/python dist/*.whl
          cd /tmp
          /tmp/anylumino-wheel/bin/python - <<'PY'
          import anylumino as al
          import anylumino.astryx as ax

          panel = al.TabPanel({"text": ax.Text("Wheel check")})
          assert panel.child_keys == ["text"]
          for widget in (panel, panel["text"], al.DatePicker()):
              state = widget.get_state()
              assert "export" in state["_esm"]
              assert "anylumino" in state["_css"]
          PY
