name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend bundles
        run: npm run build

      - name: Verify committed bundles are current
        run: git diff --exit-code -- src/anylumino/static

      - name: Install Python dependencies
        run: uv sync --dev

      - name: Run tests
        run: uv run --no-sync pytest
