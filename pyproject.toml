[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "anylumino"
version = "0.1.0"
description = "Lumino layout widgets for composing anywidgets."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Nautilus" }]
dependencies = [
    "anywidget>=0.11.0",
    "traitlets>=5.15.1",
]

[dependency-groups]
dev = [
    "griffe>=0.49.0,<1",
    "itables[widget]>=2.8.1",
    "jupyter>=1.1.1",
    "jupytext>=1.19.4",
    "pandas>=2.3.3",
    "plotly>=6.9.0",
    "pytest>=9.1.1",
    "pywebview>=6.2.1",
    "quartodoc>=0.11.1",
]

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/anylumino"]

[tool.pytest.ini_options]
testpaths = ["tests"]
