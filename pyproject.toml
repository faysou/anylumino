[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "anylumino"
version = "0.1.1"
description = "Lumino layout widgets for composing anywidgets."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_LICENSES.md"]
authors = [{ name = "Faysal Aberkane" }]
dependencies = [
    "anywidget>=0.11.0",
    "traitlets>=5.15.1",
]

[project.urls]
Homepage = "https://github.com/faysou/anylumino"
Repository = "https://github.com/faysou/anylumino"
Issues = "https://github.com/faysou/anylumino/issues"

[dependency-groups]
dev = [
    "griffe>=1.13.0,<2",
    "griffe-typingdoc>=0.2.8,<1",
    "itables[widget]>=2.8.1",
    "jupyter>=1.1.1",
    "jupytext>=1.19.4",
    "pandas>=2.3.3",
    "plotly>=6.9.0",
    "pytest>=9.1.1",
    "pywebview>=6.2.1",
]

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/anylumino"]

[tool.pytest.ini_options]
testpaths = ["tests"]
