project:
  type: website
  output-dir: _site

metadata-files:
  - reference/_sidebar.yml

website:
  title: "anylumino"
  search:
    location: navbar
    type: overlay
  navbar:
    background: "#101820"
    foreground: "#f8fafc"
    left:
      - href: index.qmd
        text: Overview
      - href: guide-overview.qmd
        text: Guide
      - href: reference/index.qmd
        text: API
    right:
      - icon: github
        href: https://github.com/
        aria-label: GitHub
  sidebar:
    - title: "Guide"
      style: docked
      contents:
        - guide-overview.qmd
        - guide.qmd
        - astryx.qmd
        - controls.qmd
        - examples.qmd

format:
  html:
    theme:
      light: [cosmo, styles.scss]
    css:
      - reference/_styles-quartodoc.css
    toc: true
    code-copy: true
    anchor-sections: true

execute:
  freeze: auto

quartodoc:
  package: anylumino
  title: "API reference"
  dir: reference
  dynamic: true
  sidebar: reference/_sidebar.yml
  css: reference/_styles-quartodoc.css
  sections:
    - title: "Layout widgets"
      desc: "Lumino-backed containers for composing anywidget children."
      contents:
        - LayoutWidget
        - TabPanel
        - BoxPanel
        - HBox
        - VBox
        - ScrollBox
        - SplitPanel
        - DockPanel
        - AccordionPanel
        - StackedPanel
        - GridPanel
        - ResponsivePanel
    - title: "Astryx base and theme"
      desc: "Shared Astryx wrapper primitives and reusable theme identity."
      contents:
        - astryx.Widget
        - astryx.Component
        - astryx.Brand
        - astryx.BuiltTheme
        - astryx.Theme
    - title: "Astryx typography and content"
      desc: "Text, headings, code, markdown, and semantic inline content."
      contents:
        - astryx.Text
        - astryx.Heading
        - astryx.Markdown
        - astryx.Code
        - astryx.CodeBlock
        - astryx.Blockquote
        - astryx.Kbd
        - astryx.Link
        - astryx.Citation
        - astryx.Timestamp
        - astryx.Thumbnail
        - astryx.Avatar
        - astryx.AvatarGroup
        - astryx.Icon
    - title: "Astryx layout containers"
      desc: "Containers for arranging Astryx content inside notebook outputs."
      contents:
        - astryx.Stack
        - astryx.Grid
        - astryx.Center
        - astryx.Section
        - astryx.Card
        - astryx.ClickableCard
        - astryx.AspectRatio
        - astryx.Divider
        - astryx.Collapsible
    - title: "Astryx forms and inputs"
      desc: "Form composition and direct value-entry controls."
      contents:
        - astryx.FormLayout
        - astryx.Field
        - astryx.FieldStatus
        - astryx.InputGroup
        - astryx.TextInput
        - astryx.TextArea
        - astryx.NumberInput
        - astryx.Slider
        - astryx.Checkbox
        - astryx.Switch
        - astryx.ToggleButton
        - astryx.DateInput
        - astryx.DateRangeInput
        - astryx.DateTimeInput
        - astryx.TimeInput
        - astryx.Calendar
        - astryx.FileInput
    - title: "Astryx selection and search"
      desc: "Choice controls, searchable fields, and tokenized filters."
      contents:
        - astryx.Selector
        - astryx.MultiSelector
        - astryx.SegmentedControl
        - astryx.RadioList
        - astryx.CheckboxList
        - astryx.Typeahead
        - astryx.Tokenizer
    - title: "Astryx actions and menus"
      desc: "Buttons, toolbars, menus, and command launchers."
      contents:
        - astryx.Button
        - astryx.IconButton
        - astryx.ButtonGroup
        - astryx.Toolbar
        - astryx.DropdownMenu
        - astryx.MoreMenu
        - astryx.CommandPalette
    - title: "Astryx feedback and status"
      desc: "Status indicators, progress, loading states, and empty states."
      contents:
        - astryx.Badge
        - astryx.StatusDot
        - astryx.ProgressBar
        - astryx.Spinner
        - astryx.Skeleton
        - astryx.Token
        - astryx.Banner
        - astryx.EmptyState
    - title: "Astryx overlays and previews"
      desc: "Notebook-safe tooltip, popover, hover-card, and dialog surfaces."
      contents:
        - astryx.Tooltip
        - astryx.HoverCard
        - astryx.Popover
        - astryx.Dialog
        - astryx.AlertDialog
    - title: "Astryx navigation and data"
      desc: "Tabs, lists, outlines, tree views, metadata, and tables."
      contents:
        - astryx.Breadcrumbs
        - astryx.TabList
        - astryx.List
        - astryx.MetadataList
        - astryx.Outline
        - astryx.TreeList
        - astryx.Table
