project:
  type: website
  output-dir: _site

metadata-files:
  - reference/_sidebar.yml

website:
  title: "anylumino"
  search:
    location: navbar
    type: overlay
  navbar:
    background: "#101820"
    foreground: "#f8fafc"
    left:
      - href: index.qmd
        text: Overview
      - href: guide-overview.qmd
        text: Guide
      - href: reference/index.qmd
        text: API
    right:
      - icon: github
        href: https://github.com/
        aria-label: GitHub
  sidebar:
    - title: "Guide"
      style: docked
      contents:
        - guide-overview.qmd
        - guide.qmd
        - astryx.qmd
        - controls.qmd
        - examples.qmd

format:
  html:
    theme:
      light: [cosmo, styles.scss]
    css:
      - reference/_styles-quartodoc.css
    toc: true
    code-copy: true
    anchor-sections: true

execute:
  freeze: auto

quartodoc:
  package: anylumino
  title: "API reference"
  dir: reference
  dynamic: true
  sidebar: reference/_sidebar.yml
  css: reference/_styles-quartodoc.css
  sections:
    - title: "Layout widgets"
      desc: "Lumino-backed containers for composing anywidget children."
      contents:
        - LayoutWidget
        - TabPanel
        - BoxPanel
        - HBox
        - VBox
        - ScrollBox
        - SplitPanel
        - DockPanel
        - AccordionPanel
        - StackedPanel
        - GridPanel
        - ResponsivePanel
        - TextWidget
    - title: "Astryx base and theme"
      desc: "Shared Astryx wrapper primitives and reusable theme identity."
      contents:
        - AstryxWidget
        - AstryxComponent
        - AstryxBrand
        - AstryxBuiltTheme
        - AstryxTheme
    - title: "Astryx typography and content"
      desc: "Text, headings, code, markdown, and semantic inline content."
      contents:
        - AstryxText
        - AstryxHeading
        - AstryxMarkdown
        - AstryxCode
        - AstryxCodeBlock
        - AstryxBlockquote
        - AstryxKbd
        - AstryxLink
        - AstryxCitation
        - AstryxTimestamp
        - AstryxThumbnail
        - AstryxAvatar
        - AstryxAvatarGroup
        - AstryxIcon
    - title: "Astryx layout containers"
      desc: "Containers for arranging Astryx content inside notebook outputs."
      contents:
        - AstryxStack
        - AstryxGrid
        - AstryxCenter
        - AstryxSection
        - AstryxCard
        - AstryxClickableCard
        - AstryxAspectRatio
        - AstryxDivider
        - AstryxCollapsible
    - title: "Astryx forms and inputs"
      desc: "Form composition and direct value-entry controls."
      contents:
        - AstryxFormLayout
        - AstryxField
        - AstryxFieldStatus
        - AstryxInputGroup
        - AstryxTextInput
        - AstryxTextArea
        - AstryxNumberInput
        - AstryxSlider
        - AstryxCheckbox
        - AstryxSwitch
        - AstryxToggleButton
        - AstryxDateInput
        - AstryxDateRangeInput
        - AstryxDateTimeInput
        - AstryxTimeInput
        - AstryxCalendar
        - AstryxFileInput
    - title: "Astryx selection and search"
      desc: "Choice controls, searchable fields, and tokenized filters."
      contents:
        - AstryxSelector
        - AstryxMultiSelector
        - AstryxSegmentedControl
        - AstryxRadioList
        - AstryxCheckboxList
        - AstryxTypeahead
        - AstryxTokenizer
    - title: "Astryx actions and menus"
      desc: "Buttons, toolbars, menus, and command launchers."
      contents:
        - AstryxButton
        - AstryxIconButton
        - AstryxButtonGroup
        - AstryxToolbar
        - AstryxDropdownMenu
        - AstryxMoreMenu
        - AstryxCommandPalette
    - title: "Astryx feedback and status"
      desc: "Status indicators, progress, loading states, and empty states."
      contents:
        - AstryxBadge
        - AstryxStatusDot
        - AstryxProgressBar
        - AstryxSpinner
        - AstryxSkeleton
        - AstryxToken
        - AstryxBanner
        - AstryxEmptyState
    - title: "Astryx overlays and previews"
      desc: "Notebook-safe tooltip, popover, hover-card, and dialog surfaces."
      contents:
        - AstryxTooltip
        - AstryxHoverCard
        - AstryxPopover
        - AstryxDialog
        - AstryxAlertDialog
    - title: "Astryx navigation and data"
      desc: "Tabs, lists, outlines, tree views, metadata, and tables."
      contents:
        - AstryxBreadcrumbs
        - AstryxTabList
        - AstryxList
        - AstryxMetadataList
        - AstryxOutline
        - AstryxTreeList
        - AstryxTable
