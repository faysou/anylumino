project:
  type: website
  output-dir: _site

metadata-files:
  - reference/_sidebar.yml

website:
  title: "anylumino"
  search:
    location: navbar
    type: overlay
  navbar:
    background: "#101820"
    foreground: "#f8fafc"
    left:
      - href: index.qmd
        text: Overview
      - href: guide-overview.qmd
        text: Guide
      - href: reference/index.qmd
        text: API
    right:
      - icon: github
        href: https://github.com/
        aria-label: GitHub
  sidebar:
    - title: "Guide"
      style: docked
      contents:
        - guide-overview.qmd
        - guide.qmd
        - astryx.qmd
        - controls.qmd
        - examples.qmd

format:
  html:
    theme:
      light: [cosmo, styles.scss]
    css:
      - reference/_styles-quartodoc.css
    toc: true
    code-copy: true
    anchor-sections: true

execute:
  freeze: auto

quartodoc:
  package: anylumino
  title: "API reference"
  dir: reference
  dynamic: true
  options:
    signature_name: short
  sidebar: reference/_sidebar.yml
  css: reference/_styles-quartodoc.css
  sections:
    - title: "Layout widgets"
      desc: "Lumino-backed containers for composing anywidget children."
      contents:
        - LayoutWidget
        - TabPanel
        - BoxPanel
        - HBox
        - VBox
        - ScrollBox
        - SplitPanel
        - DockPanel
        - AccordionPanel
        - StackedPanel
        - GridPanel
        - ResponsivePanel
    - title: "Astryx base and theme"
      desc: "Shared Astryx wrapper primitives and reusable theme identity."
      package: anylumino.astryx
      contents:
        - Widget
        - Component
        - Brand
        - BuiltTheme
        - Theme
    - title: "Astryx typography and content"
      desc: "Text, headings, code, markdown, and semantic inline content."
      package: anylumino.astryx
      contents:
        - Text
        - Heading
        - Markdown
        - Code
        - CodeBlock
        - Blockquote
        - Kbd
        - Link
        - Citation
        - Timestamp
        - Thumbnail
        - Avatar
        - AvatarGroup
        - Icon
    - title: "Astryx layout containers"
      desc: "Containers for arranging Astryx content inside notebook outputs."
      package: anylumino.astryx
      contents:
        - Stack
        - Grid
        - Center
        - Carousel
        - Section
        - Card
        - ClickableCard
        - SelectableCard
        - AspectRatio
        - Divider
        - Collapsible
    - title: "Astryx forms and inputs"
      desc: "Form composition and direct value-entry controls."
      package: anylumino.astryx
      contents:
        - FormLayout
        - Field
        - FieldStatus
        - InputGroup
        - TextInput
        - TextArea
        - NumberInput
        - Slider
        - LogSlider
        - SelectionSlider
        - Checkbox
        - Switch
        - ToggleButton
        - DateInput
        - DateRangeInput
        - DateTimeInput
        - TimeInput
        - Calendar
        - FileInput
    - title: "Astryx selection and search"
      desc: "Choice controls, searchable fields, and tokenized filters."
      package: anylumino.astryx
      contents:
        - Selector
        - MultiSelector
        - PowerSearch
        - SegmentedControl
        - RadioList
        - CheckboxList
        - Typeahead
        - Tokenizer
    - title: "Astryx actions and menus"
      desc: "Buttons, toolbars, menus, and command launchers."
      package: anylumino.astryx
      contents:
        - Button
        - IconButton
        - ButtonGroup
        - ToggleButtonGroup
        - Toolbar
        - ContextMenu
        - DropdownMenu
        - MoreMenu
        - CommandPalette
    - title: "Astryx feedback and status"
      desc: "Status indicators, progress, loading states, and empty states."
      package: anylumino.astryx
      contents:
        - Badge
        - StatusDot
        - ProgressBar
        - Spinner
        - Skeleton
        - Token
        - Banner
        - EmptyState
    - title: "Astryx overlays and previews"
      desc: "Notebook-safe tooltip, popover, hover-card, and dialog surfaces."
      package: anylumino.astryx
      contents:
        - Tooltip
        - HoverCard
        - Popover
        - Overlay
        - Lightbox
        - Dialog
        - AlertDialog
    - title: "Astryx navigation and data"
      desc: "Tabs, lists, outlines, tree views, metadata, and tables."
      package: anylumino.astryx
      contents:
        - Breadcrumbs
        - TabList
        - List
        - MetadataList
        - Outline
        - TreeList
        - Table
        - Pagination
